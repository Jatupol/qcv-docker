# client/nginx.conf
# Sampling Inspection Control System - Main Nginx Configuration
# Ubuntu 24.04 + Podman + nginx:alpine
# Optimized for Sampling Inspection Control System Dashboards

# ==================== MAIN CONTEXT ====================
# user nginx-qc;  # Commented out - running as root to bind to port 80
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx/nginx.pid;

# Optimize for sampling Inspection  environment
worker_rlimit_nofile 65535;

# ==================== EVENTS BLOCK ====================
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

# ==================== HTTP BLOCK ====================
http {
    # ==================== MIME TYPES & BASIC SETTINGS ====================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==================== LOGGING CONFIGURATION ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # sampling Inspection -specific log format for quality control monitoring
    log_format Inspection  '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'module="$uri" response_time=$request_time '
                            'session="$cookie_connect_sid"';

    access_log /var/log/nginx/access.log Inspection ;
    error_log /var/log/nginx/error.log warn;

    # ==================== PERFORMANCE SETTINGS ====================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_tokens off;

    # File upload settings for sampling Inspection  reports and photos
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # ==================== BUFFER SETTINGS ====================
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # ==================== GZIP COMPRESSION ====================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_disable "msie6";
    
    # Compress sampling Inspection  dashboard assets
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ==================== SECURITY HEADERS ====================
    # Security headers for sampling Inspection  environment
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy for sampling Inspection  dashboards
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; media-src 'self'; object-src 'none'; frame-ancestors 'self';" always;

    # ==================== SSL/TLS SETTINGS (for HTTPS) ====================
    # Uncomment for production HTTPS deployment
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # ==================== RATE LIMITING ====================
    # Protect against sampling Inspection  system abuse
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=reports:10m rate=5r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 20;

    # ==================== DNS RESOLVER ====================
    # Use Docker/Podman internal DNS resolver for dynamic service discovery
    # Resolver is defined per location block to support dynamic DNS resolution

    # ==================== CACHE SETTINGS ====================
    # Cache for static assets
    proxy_cache_path /var/cache/nginx/sampling_cache levels=1:2 keys_zone=sampling_cache:100m inactive=60m max_size=1g;

    # ==================== MAP DEFINITIONS ====================
    # Map for setting cache control based on file type
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    1M;
        ~font/                     1M;
        application/pdf            1h;
        application/json           off;
    }

    # Map sampling inspection modules for logging
    map $uri $sampling_module {
        ~^/dashboard     "dashboard";
        ~^/inspection    "inspection";
        ~^/reports       "reports";
        ~^/masterdata    "masterdata";
        ~^/admin         "admin";
        ~^/api/          "api";
        default          "frontend";
    }

    # ==================== SERVER CONFIGURATION ====================
    # Server block defined in /etc/nginx/conf.d/sampling-inspection.conf
    # (loaded via the `include` directive at the bottom of this file).
    # Keep nginx.conf for `http {}` settings only — single source of truth.

    # ==================== HTTPS SERVER (for production) ====================
    # Uncomment and configure for production HTTPS deployment
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-sampling-domain.com;
    #
    #     ssl_certificate /path/to/your/certificate.crt;
    #     ssl_certificate_key /path/to/your/private.key;
    #
    #     # Include all location blocks from above
    # }
    #
    # # Redirect HTTP to HTTPS
    # server {
    #     listen 80;
    #     server_name your-sampling-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }

    # ==================== ADDITIONAL CONFIGURATIONS ====================
    include /etc/nginx/conf.d/*.conf;
}

 